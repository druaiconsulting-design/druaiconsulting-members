<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2342" />
    <meta name="description" content="DRU AI Leadership Ecosystem™ Member Portal" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DRU AI" />
    <title>DRU Member Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #051528;
        color: #EDE8DB;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
      input, textarea, select { font-family: inherit; outline: none; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e3d6e; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #2d5a9e; }

      /* Spinner */
      @keyframes dru-spin {
        to { transform: rotate(360deg); }
      }

      /* Fade-in */
      @keyframes dru-fadein {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Pulse — used for Coming Soon indicators */
      @keyframes dru-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(0.85); }
      }

      .dru-page-enter {
        animation: dru-fadein 0.22s ease forwards;
      }

      /* Sidebar hover effects */
      .sidebar-nav-item:hover {
        background: rgba(212,175,55,0.08) !important;
        color: #D4AF37 !important;
      }
      .topnav-link:hover {
        background: rgba(212,175,55,0.08) !important;
        color: #D4AF37 !important;
      }
      .icon-btn:hover {
        background: rgba(255,255,255,0.07) !important;
        color: #EDE8DB !important;
      }
      .new-post-btn:hover {
        background: rgba(212,175,55,0.18) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
